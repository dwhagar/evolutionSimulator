[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolution-simulator"
dynamic = ["version"]
description = "An evolution simulator written in Python."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "dwhagar" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6",
    "pytest-xdist>=3.5",
    "pyinstrument>=4.6",
    "pytest-benchmark>=4",
]
gui = ["PySide6-Essentials>=6.6", "numpy>=1.26", "pyqtgraph>=0.13"]
package = ["pyinstaller>=6.6"]

[project.gui-scripts]
evolution-simulator-gui = "evolution_simulator.viewer.app:main"

[tool.hatch.version]
source = "code"
path = "src/evolution_tools/version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/evolution_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Ruff also formats the Python code blocks inside Markdown; the design notes keep their sketches
# as written, so `ruff format .` leaves Markdown alone (INFRA.5).
exclude = ["*.md"]
